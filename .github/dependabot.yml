version: 2
updates:
  - package-ecosystem: npm
    directories:
      - /
      - /apps/mobile
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Europe/Madrid
    open-pull-requests-limit: 5
    groups:
      routine-dependencies:
        patterns: ["*"]
        update-types: [minor, patch]
      security-dependencies:
        applies-to: security-updates
        patterns: ["*"]
